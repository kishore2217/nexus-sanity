name: Deploy Studio to Cloudflare Pages

# Title of each run in the Actions list. A Nexus dispatch would otherwise show as its bare event
# type ("sanity-layout-schema"); name it after what changed. Nexus may send
# client_payload.reason (e.g. "Page \"Blog\" updated") to say exactly what; otherwise a generic
# title covers both layouts and pages. Pushes keep the commit message, manual runs say so.
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('Nexus sync: {0}', github.event.client_payload.reason || 'layouts & pages updated')
    || github.event_name == 'workflow_dispatch' && 'Manual studio deploy'
    || github.event.head_commit.message }}

on:
  push:
    branches: [main]
    # Docs-only changes don't change the studio.
    paths-ignore: ["**.md"]
  workflow_dispatch:
  # Fired by the Nexus sync after a layout or page is submitted, so the studio rebuilds with the
  # new schema:
  # POST /repos/kishore2217/nexus-sanity/dispatches
  #   {"event_type": "sanity-layout-schema", "client_payload": {"reason": "Layout \"Home\" updated"}}
  repository_dispatch:
    types: [sanity-layout-schema]

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A normal run takes a couple of minutes; don't let a hung install or deploy burn hours.
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # `npm run build` triggers `prebuild`, which runs scripts/generate-layout-schemas.ts.
      # That script only reads from Sanity, so a read token is enough; `sanity exec
      # --with-user-token` picks it up from SANITY_AUTH_TOKEN.
      - name: Build studio
        run: npm run build
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

      # Run wrangler directly instead of cloudflare/wrangler-action, which still targets Node 20.
      # --commit-dirty: the prebuild step regenerates the tracked schemaTypes/layouts.generated.ts,
      # so the tree is expected to be dirty here.
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=nexus-sanity --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
