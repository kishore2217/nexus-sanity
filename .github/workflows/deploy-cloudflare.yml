name: Deploy Studio to Cloudflare Pages

on:
  push:
    branches: [main]
    # Docs-only changes don't change the studio.
    paths-ignore: ["**.md"]
  workflow_dispatch:
  # Fired by the Nexus sync after a layout is submitted, so the studio rebuilds with the new schema:
  # POST /repos/kishore2217/nexus-sanity/dispatches {"event_type": "sanity-layout-schema"}
  repository_dispatch:
    types: [sanity-layout-schema]

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A normal run takes a couple of minutes; don't let a hung install or deploy burn hours.
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # `npm run build` triggers `prebuild`, which runs scripts/generate-layout-schemas.ts.
      # That script only reads from Sanity, so a read token is enough; `sanity exec
      # --with-user-token` picks it up from SANITY_AUTH_TOKEN.
      - name: Build studio
        run: npm run build
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

      # Run wrangler directly instead of cloudflare/wrangler-action, which still targets Node 20.
      # --commit-dirty: the prebuild step regenerates the tracked schemaTypes/layouts.generated.ts,
      # so the tree is expected to be dirty here.
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=nexus-sanity --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
